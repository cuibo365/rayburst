[[permission]]
identifier = "allow-cloud-drive-baidu-download"
description = "Enables the cloud_drive_baidu_download command from the embedded Baidu Netdisk webview."
commands.allow = ["cloud_drive_baidu_download"]

[[permission]]
identifier = "allow-cloud-drive-baidu-close"
description = "Enables the cloud_drive_baidu_close command from the embedded Baidu Netdisk webview."
commands.allow = ["cloud_drive_baidu_close"]

[[permission]]
identifier = "allow-all-app-commands"
description = "Allows all application commands from the main window, preserving the pre-ACL-manifest behavior of the app."
commands.allow = ["*"]
