[[permission]]
identifier = "allow-cloud-drive-baidu-download"
description = "Enables the cloud_drive_baidu_download command from the embedded Baidu Netdisk webview."
commands.allow = ["cloud_drive_baidu_download"]

[[permission]]
identifier = "allow-cloud-drive-nav-back"
description = "Enables the cloud_drive_nav_back command from the Baidu Netdisk page in full-screen navigation mode."
commands.allow = ["cloud_drive_nav_back"]

